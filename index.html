<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MB Stats">
<title>Matched Betting</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=22">
<script>
  // Apply the saved theme before the page draws, so it never flashes the wrong colours.
  (function () {
    var t = 'auto';
    try { t = JSON.parse(localStorage.getItem('mb.prefs') || '{}').theme || 'auto'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1 id="pageTitle">Home</h1>
      <div id="updated" class="muted small">Loading…</div>
    </div>
    <div class="actions">
      <button id="menu" class="icon-btn round" aria-label="Menu" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="bets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Bets</span>
    </button>
    <button data-tab="add" class="tab-add" aria-label="Add a bet">
      <span class="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>
    </button>
    <button data-tab="offers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zm0 0 2-3h11v3M16 13.5h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Offers</span>
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V4M16 20v-6M21 20H3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Stats</span>
    </button>
  </nav>
</div>

<div id="setup" class="setup" hidden>
  <div class="setup-card">
    <h1>Connect your sheet</h1>
    <p class="muted">Paste the private link from your spreadsheet's script. It starts with <b>https://script.google.com/</b> and ends with <b>?key=…</b></p>
    <input id="link" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec?key=…">
    <button id="save" class="primary">Connect</button>
    <p id="setupMsg" class="small"></p>
    <button id="cancelSetup" class="text-btn" hidden>Cancel</button>
    <p class="muted small">The link is only saved on this phone.</p>
  </div>
</div>

<div id="sheet" class="sheet-wrap" hidden></div>

<div id="toast" class="toast" role="status"></div>

<script src="app.js?v=22"></script>
</body>
</html>
